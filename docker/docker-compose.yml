version: '3.8'

# ================================================================
# Java Tech Stack Lab - Docker Compose
# ================================================================
# Usage:
#   docker compose up -d mysql redis           # Start specific services
#   docker compose up -d                       # Start all infrastructure
#   docker compose --profile monitor up -d     # Start with monitoring stack
#   docker compose down                        # Stop all services
#   docker compose down -v                     # Stop and remove volumes
# ================================================================

services:

  # ---- MySQL 8.0 ----
  mysql:
    image: mysql:8.0
    container_name: lab-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: lab_mysql
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    container_name: lab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ---- MongoDB 6 ----
  mongodb:
    image: mongo:6
    container_name: lab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ---- Elasticsearch 7 ----
  elasticsearch:
    image: elasticsearch:7.17.16
    container_name: lab-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ---- RabbitMQ 3.12 (with Management UI) ----
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: lab-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ---- Zookeeper 3.8 ----
  zookeeper:
    image: zookeeper:3.8
    container_name: lab-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    volumes:
      - zk_data:/data
      - zk_datalog:/datalog

  # ---- Kafka 3.6 ----
  kafka:
    image: bitnami/kafka:3.6
    container_name: lab-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/bitnami/kafka

  # ---- MinIO ----
  minio:
    image: minio/minio:latest
    container_name: lab-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ---- Nacos 2.2 (Spring Cloud registry/config) ----
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: lab-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname

  # ---- Monitoring Stack (profile: monitor) ----
  prometheus:
    image: prom/prometheus:latest
    container_name: lab-prometheus
    restart: unless-stopped
    profiles:
      - monitor
    ports:
      - "9090:9090"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: lab-grafana
    restart: unless-stopped
    profiles:
      - monitor
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  es_data:
  rabbitmq_data:
  zk_data:
  zk_datalog:
  kafka_data:
  minio_data:
  prometheus_data:
  grafana_data:
